[telnet]
request_url = https://192.168.1.1/cgi-bin/sdmctelnet_enable.asp
port = 23
user = sdmc
password = 1234
timeout = 10
input_user_flag = ogin:
input_password_flag = Password:
login_success_flag =#
only_power_off_on=0
telnet_need_enter_password_flag = 1

[order]
sys wan2lan on 15 wait_time_120=
ponmgr gpon get info retry_times_10 = ONU State: O5
ifconfig ppp0 retry_times_10 = inet addr:172.172.172&&inet6 addr: 2001:172:101
ifconfig nas1_0 retry_times_10 = inet addr:10.10.46
;ifconfig nas1_0 retry_times_10 = inet addr:172.18.18
ifconfig nas2_0 retry_times_10 = inet addr:172.33.5
usr/bin/ip ro show retry_times_10 = default via 172.172.172
ifconfig rai0 retry_times_10 = !00:00:00:00:00:00&&UP BROADCAST
ifconfig rai3 retry_times_10 = !00:00:00:00:00:00&&UP BROADCAST
tcapi get InfoVoIP_Entry0 Status retry_times_10 = Up
;tcapi get InfoVoIP_Entry1 Status retry_times_10 = Up
tcapi show cwmp retry_times_10 = [periodActive = Yes]&&[Inform_Status = 8]