[telnet]
request_url = http://192.168.1.1/cgi-bin/sdmctelnet_enable.asp
port = 23
user = sdmc
password = 1234
timeout = 10
input_user_flag = tc login:
input_password_flag = Password:
login_success_flag =#

[order]
ifconfig ra0 = Link encap:Ethernet
ifconfig rai0 = Link encap:Ethernet
ethphxcmd eth0 media-type port 2 = Link is up
ponmgr gpon get info = ONU State: O5
