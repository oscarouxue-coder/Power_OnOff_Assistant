[telnet]
request_url = http://192.168.1.1/cgi-bin/sdmctelnet_enable.asp
port = 23
user = SDMC
password =1234
timeout = 10
input_user_flag = ogin:
input_password_flag = Password:
login_success_flag = #
telnet_need_enter_password_flag = 1
only_power_off_on=1

[order]
ifconfig=
;gateway=gateway>
;wifirpc=wifirpc>
;wlan_rpcConnectClient=wifirpc>
;wlan_getChannel 0=entry 0 Channel is 1 with
;wlan_getChannel 1=entry 1 Channel is 100 with
;wlan_closeRpc=close RPC with result 0
;exit&&0=gateway>
;exit&&1=mainMenu>
;doc=docsis>
;cm=The CM status is NOT_SYNCHRONIZED