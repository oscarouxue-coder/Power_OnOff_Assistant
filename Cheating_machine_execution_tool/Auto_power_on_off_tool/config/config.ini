[config]
test_project = test_project_config.ini

[ui_defaults]
# ONU 通信方式：telnet / ssh
communication_method = telnet
# 新工具 test_project_config.ini [telnet] telnet_default_on 的反向镜像：默认已开=1 时此处=0
telnet_enable = 0
# 程控电源串口波特率
baud_rate = 19200
# 默认测试方案名称，对应 [config] 中的键名，不区分大小写
selected_profile = TEST_PROJECT
# 上电后等待设备启动时间（秒）
startup_time = 180
# 每轮断电后的等待时间（秒）
interval_time = 10
# 测试循环次数
number_of_tests = 5
# 指令执行完成后、下电前等待时间（秒）
wait_command_done = 10

[dingtalk_config]
# 是否启用钉钉机器人发送消息，1表示启用，0表示不启用
dingtalk_flag = 1
# 钉钉机器人 webHook 连接
webhook = https://oapi.dingtalk.com/robot/send?access_token=de28a4b6c03c08b7e26afaade6ce510bb24a40aefe81e39e998413860f62afce
# 安全设置-加签
secret = SEC1df1c4f812f40ccfac69a378d0dca0cba72e7f945c7c5bd5d9c36e17db3bcdb2
# 是否 @所有人，1表示@所有人
at_all = 0

[remote_config]
# 远程工具名称
remote_tool_name = 向日葵
# 远程控制工具 识别码
remote_identification_code = 105170455
# 远程控制工具 验证码
remote_verification_code = sdmc1234

[other_config]
# 指令失败的重试间隔
command_fail_retry_interval_time = 60
# 开启 telnet 失败时的重试次数
telnet_enable_fail_retry_times = 5
# 开启 telnet 失败时的重试间隔
telnet_enable_fail_retry_interval = 10
# 连接SSH 失败时的重试次数
SSH_connect_fail_retry_times = 10
# # 连接SSH 失败时的重试间隔
SSH_connect_fail_retry_interval = 20
# 指令集循环执行次数，特殊场景使用
commands_execute_times = 6

[Emails]
# 邮箱以英文逗号,作为分割，不填写则默认发送给 Ray_wang@sdmctech.com
emails = ""
