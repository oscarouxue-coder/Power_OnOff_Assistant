[telnet]
request_url = http://192.168.101.1/cgi-bin/sdmctelnet_enable.asp
port = 23
user = sdmc	
password = 1234
timeout = 10
input_user_flag = ogin:
input_password_flag = Password:
login_success_flag =#
telnet_need_enter_password_flag = 1
only_power_off_on = 0

[order]
;ifconfig | grep pon wait_time_5 retry_times_6=pon       Link encap:Ethernet  HWaddr&&!00:00:00:00:00:00
ifconfig | grep ra0 wait_time_5 retry_times_6=ra0       Link encap:Ethernet  HWaddr&&!00:00:00:00:00:00
ifconfig | grep rai0 wait_time_5 retry_times_6=rai0      Link encap:Ethernet  HWaddr&&!00:00:00:00:00:00
ifconfig eth0 wait_time_5 retry_times_6=eth0      Link encap:Ethernet  HWaddr&&!00:00:00:00:00:00
;ot-ctl state  wait_time_5=disabled
;/usr/script/voip_load.sh wait_time_25=
;ps | grep sipclient wait_time_2=</userfs/bin/sipclient

;ethphxcmd eth0 media-type port 2 = Link is up
