[telnet]
request_url = http://192.168.29.1
port = 23
user = sdmc
password = 1234
timeout = 10
input_user_flag = ogin:
input_password_flag = Password:
login_success_flag = #
telnet_need_enter_password_flag = 0
telnet_no_user_password_flag = 0
only_power_off_on = 0
telnet_default_on = 1

[order]
ifconfig ra0 retry_times_5 = !00:00:00:00:00:00&&UP BROADCAST
ifconfig rai0 retry_times_5 = !00:00:00:00:00:00&&UP BROADCAST

[connect_wifi]
enable = 0
test_2g_enable = 1
test_5g_enable = 1
product_solution = openwrt
auth_mode = WPA2-PSK
cipher = AES
choose_wireless_card = 1
wireless_card_name = Intel(R) Wi-Fi 7 BE200 320MHz

