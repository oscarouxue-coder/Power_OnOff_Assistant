[telnet]
request_url = http://192.168.1.1
port = 23
user = sdmc
password = 1234
timeout = 10
input_user_flag = ogin:
input_password_flag = Password:
login_success_flag = #
telnet_need_enter_password_flag = 0
telnet_no_user_password_flag = 0
only_power_off_on = 0
telnet_default_on = 1

[order]
/userfs/bin/ponmgr gpon get info retry_times_5 = ONU State: O5
ifconfig ra0 retry_times_5 = !00:00:00:00:00:00&&UP BROADCAST
ifconfig rai0 retry_times_5 = !00:00:00:00:00:00&&UP BROADCAST
ifconfig pon1.2501.1 retry_times_5 = inet addr:10.10.46
ifconfig pon1.335.1 retry_times_5 = inet addr:172.33.5
ifconfig pppoe-iface4 retry_times_5 = inet addr:172.172.172&&inet6 addr: 2001:172:101
bbfdmd -c get Device.Services.VoiceService.1.SIP.X_SDMC_VoipLineStatus retry_times_5 = VoipLineStatus => 1
bbfdmd -c get Device.ManagementServer.X_SDMC_AcsLineStatus retry_times_5 = AcsLineStatus => 1
ip route show table main | grep default retry_times_5 = default via 172.172.172.1

[connect_wifi]
enable = 1
test_2g_enable = 1
test_5g_enable = 1
product_solution = openwrt
auth_mode = WPA2-PSK
cipher = AES
choose_wireless_card = 0
wireless_card_name =

[project_info]
project_name = 基线_NP7287XGS
software_version = S13.58.01.001
internal_software_version = T13.58.01.003
onu_compile_time = Linux version 5.4.55 (jenkins@rd-52) (gcc version 10.2.0 (OpenWrt GCC 10.2.0 r16325-88151b8303)) #0 SMP Mon Jun 8 10:16:25 UTC 2026
