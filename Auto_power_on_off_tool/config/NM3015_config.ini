[telnet]
request_url = http://192.168.5.1/ubus/xlink.system.TelnetSet
port = 23
user = admin
password = admin
timeout = 10
input_user_flag = ogin:
input_password_flag = Password:
login_success_flag = >
telnet_need_enter_password_flag = 1
only_power_off_on = 0
login_after_input_str =vlucktohappy


[order]
;ethctl eth0 media-type= Link is Up at Speed: 1G
prolinecmd restore default wait_time_10 = The system is going down NOW
;ifconfig wl0 = UP BROADCAST RUNNING
;ethctl eth1 media-type = Link is Up at Speed: 100M
;ubus call xlink.wan netstate_get="connect_status": 1
;ubus call xlink.wan stateGet=bytesReceived

